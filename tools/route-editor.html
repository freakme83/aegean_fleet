<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aegean Fleet · Rota Editörü</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>:root{--n:#0f2742;--t:#c96c4a;--g:#19795d}*{box-sizing:border-box}html,body,#map{margin:0;width:100%;height:100%;font-family:system-ui,sans-serif;color:var(--n)}body{overflow:hidden}#map{position:fixed;inset:0}.bar,.panel{position:fixed;z-index:1200;background:rgba(255,255,255,.97);border:1px solid rgba(15,39,66,.14);box-shadow:0 14px 34px rgba(15,39,66,.18)}.bar{top:16px;left:16px;right:16px;padding:12px;border-radius:18px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}.bar h1{font-size:17px;margin:0 8px 0 0}.version{font-size:11px;font-weight:800;padding:6px 8px;border-radius:999px;background:#fff3df;color:#94601c}select,button{height:38px;border:1px solid #d7e1e6;border-radius:10px;background:#fff;color:var(--n);font-weight:750;padding:0 12px}button{cursor:pointer}.add{background:#e9f6f1;color:var(--g)}.add.on{background:var(--g);color:#fff}.status{margin-left:auto;padding:7px 10px;border-radius:999px;background:#edf5f7;font-size:12px;font-weight:700}.hint{display:none;width:100%;padding:9px 12px;border-radius:11px;background:#e9f6f1;color:#155e49;font-size:12px;font-weight:700}.hint.show{display:block}.panel{right:16px;bottom:16px;width:min(390px,calc(100vw - 32px));padding:15px;border-radius:18px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:11px 0}.metric{padding:9px;border-radius:12px;background:#f3f7f8}.metric small{display:block;font-size:10px;color:#80909a;font-weight:800}.metric strong{display:block;margin-top:3px;font-size:17px}textarea{width:100%;height:125px;border:1px solid #d7e1e6;border-radius:12px;padding:9px;font:11px/1.45 monospace;background:#f8fafb}.point{width:25px;height:25px;display:grid;place-items:center;border:3px solid #fff;border-radius:50%;background:var(--t);color:#fff;font-size:10px;font-weight:800}.point.lock{background:var(--n)}.port-label{padding:6px 10px;border:0;border-radius:10px;background:#fff;color:var(--n);font-size:12px;font-weight:800}.port-label:before{display:none}.ship{width:30px;height:30px;display:grid;place-items:center;border:3px solid #fff;border-radius:11px;background:var(--n);color:#fff}.add-cursor #map{cursor:crosshair!important}</style></head><body><div id="map"></div><div class="bar"><h1>Rota Editörü</h1><span class="version">v6</span><select id="route"></select><button id="add" class="add">＋ Waypoint ekle</button><button id="undo">Geri al</button><button id="clear">Ara noktaları temizle</button><button id="reset">Başlangıç rotasını yükle</button><button id="test">Rotayı test et</button><span id="status" class="status"></span><div id="hint" class="hint">Waypoint ekleme açık. Haritada deniz noktasına tıkla.</div></div><aside class="panel"><h2 id="title"></h2><div class="metrics"><div class="metric"><small>Waypoint</small><strong id="count">0</strong></div><div class="metric"><small>Mesafe</small><strong id="distance">0 km</strong></div></div><textarea id="json"></textarea><button id="copy">JSON’u kopyala</button></aside><script>const ROUTES={"ayvalik-kucukkuyu":{id:"ayvalik-kucukkuyu",mode:"sea",origin:"ayvalik",destination:"kucukkuyu",durationMinutes:50,points:[[39.3192,26.6961],[39.326463,26.689739],[39.33682,26.696949],[39.347574,26.705532],[39.375445,26.689224],[39.42,26.64],[39.48,26.62],[39.540058,26.604939],[39.5443,26.605]]},"ayvalik-mytilene":{id:"ayvalik-mytilene",mode:"sea",origin:"ayvalik",destination:"mytilene",durationMinutes:55,points:[[39.3192,26.6961],[39.32394,26.670685],[39.326264,26.658325],[39.322878,26.638412],[39.323144,26.619873],[39.253525,26.595154],[39.218423,26.593094],[39.185,26.598],[39.145,26.585],[39.1125,26.5715],[39.101725,26.563869],[39.1044,26.5621]]},"ayvalik-cesme":{id:"ayvalik-cesme",mode:"sea",origin:"ayvalik",destination:"cesme",durationMinutes:205,points:[[39.3192,26.6961],[39.325932,26.654549],[39.321948,26.644077],[39.31823,26.636009],[39.315441,26.627083],[39.311191,26.620731],[39.304683,26.61747],[39.297377,26.614208],[39.287014,26.610432],[39.277447,26.606655],[39.267215,26.606827],[39.092765,26.713257],[38.976492,26.674805],[38.850403,26.566315],[38.682294,26.352081],[38.34381,26.267624],[38.325,26.295556]]},"cesme-chios":{id:"cesme-chios",mode:"sea",origin:"cesme",destination:"chios",durationMinutes:28,points:[[38.325,26.295556],[38.3268,26.271],[38.34,26.24],[38.36,26.19],[38.3685,26.153],[38.36972,26.13785]]},"chios-mytilene":{id:"chios-mytilene",mode:"sea",origin:"chios",destination:"mytilene",durationMinutes:135,points:[[38.36972,26.13785],[38.43,26.195],[38.55,26.245],[38.68,26.285],[38.81,26.34],[38.94,26.45],[39.04,26.525],[39.1044,26.5621]]},"balikesir-ayvalik":{id:"balikesir-ayvalik",mode:"road",origin:"balikesir",destination:"ayvalik",durationMinutes:150,points:[[39.676736,27.942364],[39.3192,26.6961]]}};const N={balikesir:"Balıkesir Otogarı",ayvalik:"Ayvalık",kucukkuyu:"Küçükkuyu",mytilene:"Midilli",cesme:"Çeşme",chios:"Sakız"},$=id=>document.getElementById(id),E={route:$("route"),add:$("add"),undo:$("undo"),clear:$("clear"),reset:$("reset"),test:$("test"),status:$("status"),hint:$("hint"),title:$("title"),count:$("count"),distance:$("distance"),json:$("json"),copy:$("copy")};const map=L.map("map",{center:[39.05,26.48],zoom:9,minZoom:5,maxZoom:15,zoomControl:false,attributionControl:false});L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager_nolabels/{z}/{x}/{y}{r}.png",{maxZoom:15}).addTo(map);let active,points=[],markers=[],history=[],labels=[],addMode=false,ship;const line=L.polyline([],{color:"#315f78",weight:4,dashArray:"10 9"}).addTo(map);function km(){let d=0;for(let i=0;i<points.length-1;i++)d+=map.distance(points[i],points[i+1]);return d/1000}function output(){return{id:active.id,mode:active.mode||"sea",origin:active.origin,destination:active.destination,distanceKm:+km().toFixed(1),durationMinutes:active.durationMinutes,source:active.mode==="road"?"manual-road-route-editor":"manual-route-editor",waypoints:points.map(p=>p.map(v=>+v.toFixed(6)))}}function update(){E.count.textContent=points.length;E.distance.textContent=`${km().toFixed(1)} km`;E.json.value=JSON.stringify(output(),null,2);E.status.textContent=`${N[active.origin]} → ${N[active.destination]} · ${active.mode==="road"?"Karayolu":"Denizyolu"}`;E.title.textContent=E.status.textContent}function icon(i,l){return L.divIcon({className:"",html:`<div class="point ${l?'lock':''}">${l?(i===0?'A':'B'):i}</div>`,iconSize:[25,25],iconAnchor:[12,12]})}function render(){markers.forEach(m=>m.remove());labels.forEach(m=>m.remove());markers=[];labels=[];points.forEach((p,i)=>{const locked=i===0||i===points.length-1,m=L.marker(p,{icon:icon(i,locked),draggable:!locked}).addTo(map);if(!locked){m.on("dragstart",()=>history.push(points.map(x=>[...x])));m.on("drag",e=>{const a=e.target.getLatLng();points[i]=[a.lat,a.lng];line.setLatLngs(points);update()});m.on("contextmenu",()=>{history.push(points.map(x=>[...x]));points.splice(i,1);render()})}markers.push(m)});line.setLatLngs(points);[[0,active.origin,"right"],[points.length-1,active.destination,"left"]].forEach(([i,id,dir])=>{const c=L.circleMarker(points[i],{radius:8,color:"#fff",weight:3,fillColor:"#0f2742",fillOpacity:1,interactive:false}).addTo(map);c.bindTooltip(N[id],{permanent:true,direction:dir,className:"port-label"}).openTooltip();labels.push(c)});update()}function load(id){active=ROUTES[id];points=active.points.map(p=>[...p]);history=[];render();map.fitBounds(points,{padding:[80,80]})}function nearest(ll){const cp=map.latLngToLayerPoint(ll);let bi=1,bd=Infinity;for(let i=0;i<points.length-1;i++){const a=map.latLngToLayerPoint(points[i]),b=map.latLngToLayerPoint(points[i+1]),dx=b.x-a.x,dy=b.y-a.y,t=Math.max(0,Math.min(1,((cp.x-a.x)*dx+(cp.y-a.y)*dy)/(dx*dx+dy*dy||1))),d=Math.hypot(cp.x-(a.x+dx*t),cp.y-(a.y+dy*t));if(d<bd){bd=d;bi=i+1}}return bi}E.route.innerHTML=Object.values(ROUTES).map(r=>`<option value="${r.id}">${N[r.origin]} → ${N[r.destination]}</option>`).join("");E.route.onchange=()=>load(E.route.value);E.add.onclick=()=>{addMode=!addMode;E.add.classList.toggle("on",addMode);E.hint.classList.toggle("show",addMode)};map.on("click",e=>{if(!addMode)return;history.push(points.map(x=>[...x]));points.splice(nearest(e.latlng),0,[e.latlng.lat,e.latlng.lng]);render()});E.undo.onclick=()=>{const p=history.pop();if(p){points=p;render()}};E.clear.onclick=()=>{history.push(points.map(x=>[...x]));points=[points[0],points.at(-1)];render()};E.reset.onclick=()=>load(active.id);E.copy.onclick=()=>navigator.clipboard.writeText(E.json.value);E.test.onclick=()=>{if(ship)ship.remove();ship=L.marker(points[0],{icon:L.divIcon({className:"",html:`<div class="ship">${active.mode==='road'?'🚌':'⛴'}</div>`,iconSize:[30,30],iconAnchor:[15,15]})}).addTo(map)};load(Object.keys(ROUTES)[0]);</script></body></html>
