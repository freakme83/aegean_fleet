<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aegean Fleet · Rota Editörü</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>:root{--n:#0f2742;--t:#c96c4a;--g:#19795d}*{box-sizing:border-box}html,body,#map{margin:0;width:100%;height:100%;font-family:system-ui,sans-serif;color:var(--n)}body{overflow:hidden}#map{position:fixed;inset:0}.bar,.panel{position:fixed;z-index:1200;background:rgba(255,255,255,.97);border:1px solid rgba(15,39,66,.14);box-shadow:0 14px 34px rgba(15,39,66,.18);backdrop-filter:blur(12px)}.bar{top:16px;left:16px;right:16px;padding:12px;border-radius:18px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}.bar h1{font-size:17px;margin:0 8px 0 0}select,button{height:38px;border:1px solid #d7e1e6;border-radius:10px;background:#fff;color:var(--n);font-weight:750;padding:0 12px}button{cursor:pointer}button.add{background:#e9f6f1;color:var(--g);border-color:#b8ddcf}button.add.on{background:var(--g);color:#fff}.status{margin-left:auto;padding:7px 10px;border-radius:999px;background:#edf5f7;font-size:12px;font-weight:700}.hint{display:none;width:100%;padding:9px 12px;border-radius:11px;background:#e9f6f1;color:#155e49;font-size:12px;font-weight:700}.hint.show{display:block}.panel{right:16px;bottom:16px;width:min(390px,calc(100vw - 32px));padding:15px;border-radius:18px}.panel h2{font-size:16px;margin:0 0 7px}.help{font-size:12px;line-height:1.5;color:#607482}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:11px 0}.metric{padding:9px;border-radius:12px;background:#f3f7f8}.metric small{display:block;font-size:10px;color:#80909a;font-weight:800;text-transform:uppercase}.metric strong{display:block;margin-top:3px;font-size:17px}textarea{width:100%;height:125px;border:1px solid #d7e1e6;border-radius:12px;padding:9px;font:11px/1.45 monospace;background:#f8fafb}.actions{display:flex;gap:8px;margin-top:9px}.primary{background:var(--n);color:#fff}.danger{color:#b33d3d}.point{width:25px;height:25px;display:grid;place-items:center;border:3px solid #fff;border-radius:50%;background:var(--t);color:#fff;font-size:10px;font-weight:800;box-shadow:0 3px 10px rgba(15,39,66,.35)}.point.lock{background:var(--n)}.port-label{padding:6px 10px;border:0;border-radius:10px;background:#fff;color:var(--n);font-size:12px;font-weight:800;box-shadow:0 4px 12px rgba(15,39,66,.2)}.port-label:before{display:none}.ship{width:30px;height:30px;display:grid;place-items:center;border:3px solid #fff;border-radius:11px;background:var(--n);color:#fff}.add-cursor #map{cursor:crosshair!important}@media(max-width:850px){.bar h1{width:100%}.status{width:100%;margin-left:0}.panel{left:16px;width:auto;max-height:45vh;overflow:auto}}</style></head><body><div id="map"></div><div class="bar"><h1>Rota Editörü</h1><select id="route"></select><button id="add" class="add">＋ Waypoint ekle</button><button id="undo">Geri al</button><button id="clear" class="danger">Ara noktaları temizle</button><button id="test">Rotayı test et</button><span id="status" class="status">Yükleniyor…</span><div id="hint" class="hint">Waypoint ekleme açık. Haritada istediğin deniz noktasına tıkla.</div></div><aside class="panel"><h2>Manuel rota düzenleme</h2><div class="help">“Waypoint ekle”ye basıp haritaya tıkla. Turuncu noktaları sürükle, sağ tıkla sil. A ve B liman noktaları kilitlidir.</div><div class="metrics"><div class="metric"><small>Waypoint</small><strong id="count">0</strong></div><div class="metric"><small>Mesafe</small><strong id="distance">0 km</strong></div></div><textarea id="json"></textarea><div class="actions"><button id="copy" class="primary">JSON’u kopyala</button><button id="download">JSON indir</button></div></aside><script>const fallbackPorts={ayvalik:{name:'Ayvalık',terminal:[39.3192,26.6961]},mytilene:{name:'Midilli',terminal:[39.1044,26.5621]}};const fallbackRoutes=[{id:'ayvalik-mytilene',mode:'sea',origin:'ayvalik',destination:'mytilene',durationMinutes:55,waypoints:[[39.3192,26.6961],[39.2995,26.6865],[39.274,26.672],[39.248,26.648],[39.222,26.616],[39.185,26.598],[39.145,26.585],[39.1125,26.5715],[39.1044,26.5621]]}];const $=id=>document.getElementById(id),E={route:$('route'),add:$('add'),undo:$('undo'),clear:$('clear'),test:$('test'),status:$('status'),hint:$('hint'),count:$('count'),distance:$('distance'),json:$('json')};const map=L.map('map',{center:[39.22,26.62],zoom:10,minZoom:5,maxZoom:15,zoomControl:false,attributionControl:false});L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_nolabels/{z}/{x}/{y}{r}.png',{maxZoom:15}).addTo(map);L.control.zoom({position:'bottomleft'}).addTo(map);let ports=fallbackPorts,routes=fallbackRoutes,active=null,points=[],markers=[],labels=[],history=[],addMode=false,ship=null,testFrame=null;const line=L.polyline([],{color:'#315f78',weight:4,opacity:.9,dashArray:'10 9'}).addTo(map);function normalizeRoutes(data){const raw=data?.routes??data;return Array.isArray(raw)?raw:Object.values(raw||{})}function name(k){return ports[k]?.name||k}function icon(i,locked){return L.divIcon({className:'',html:`<div class="point ${locked?'lock':''}">${locked?(i===0?'A':'B'):i}</div>`,iconSize:[25,25],iconAnchor:[12,12]})}function snapshot(){history.push(points.map(p=>[...p]));if(history.length>80)history.shift()}function km(){let d=0;for(let i=0;i<points.length-1;i++)d+=L.latLng(points[i]).distanceTo(points[i+1]);return d/1000}function out(){return{id:active.id,mode:'sea',origin:active.origin,destination:active.destination,distanceKm:+km().toFixed(1),durationMinutes:active.durationMinutes||55,waypoints:points.map(p=>p.map(v=>+v.toFixed(6)))}}function setAdd(v){addMode=v;E.add.classList.toggle('on',v);E.add.textContent=v?'✓ Waypoint ekleme açık':'＋ Waypoint ekle';E.hint.classList.toggle('show',v);document.body.classList.toggle('add-cursor',v);update()}function renderLabels(){labels.forEach(x=>x.remove());labels=[];[[0,active.origin,'right'],[points.length-1,active.destination,'left']].forEach(([i,k,dir])=>{const c=L.circleMarker(points[i],{radius:8,color:'#fff',weight:3,fillColor:dir==='right'?'#0f2742':'#c96c4a',fillOpacity:1,interactive:false}).addTo(map);c.bindTooltip(name(k),{permanent:true,direction:dir,offset:dir==='right'?[12,0]:[-12,0],className:'port-label'}).openTooltip();labels.push(c)})}function render(){markers.forEach(x=>x.remove());markers=[];points.forEach((p,i)=>{const locked=i===0||i===points.length-1,m=L.marker(p,{icon:icon(i,locked),draggable:!locked,zIndexOffset:800}).addTo(map);if(!locked){m.on('dragstart',snapshot);m.on('drag',e=>{const a=e.target.getLatLng();points[i]=[a.lat,a.lng];line.setLatLngs(points);update()});m.on('contextmenu',()=>{snapshot();points.splice(i,1);render()})}markers.push(m)});line.setLatLngs(points);renderLabels();update()}function update(){E.count.textContent=points.length;E.distance.textContent=`${km().toFixed(1)} km`;E.json.value=JSON.stringify(out(),null,2);E.status.textContent=addMode?'Haritada bir noktaya tıkla':`${name(active.origin)} → ${name(active.destination)}`}function load(id){active=routes.find(r=>r.id===id)||routes[0];points=active.waypoints.map(p=>[...p]);history=[];setAdd(false);render();map.fitBounds(points,{paddingTopLeft:[70,100],paddingBottomRight:[420,100]})}function nearest(ll){const cp=map.latLngToLayerPoint(ll);let bi=1,bd=Infinity;for(let i=0;i<points.length-1;i++){const a=map.latLngToLayerPoint(points[i]),b=map.latLngToLayerPoint(points[i+1]),dx=b.x-a.x,dy=b.y-a.y,t=Math.max(0,Math.min(1,((cp.x-a.x)*dx+(cp.y-a.y)*dy)/(dx*dx+dy*dy||1))),x=a.x+dx*t,y=a.y+dy*t,d=Math.hypot(cp.x-x,cp.y-y);if(d<bd){bd=d;bi=i+1}}return bi}map.on('click',e=>{if(!addMode||!active)return;snapshot();points.splice(nearest(e.latlng),0,[e.latlng.lat,e.latlng.lng]);render()});function pos(pr){let lens=[],tot=0;for(let i=0;i<points.length-1;i++){let l=L.latLng(points[i]).distanceTo(points[i+1]);lens.push(l);tot+=l}let t=tot*pr;for(let i=0;i<lens.length;i++){if(t<=lens[i]){let r=t/lens[i];return[points[i][0]+(points[i+1][0]-points[i][0])*r,points[i][1]+(points[i+1][1]-points[i][1])*r]}t-=lens[i]}return points.at(-1)}E.add.onclick=()=>setAdd(!addMode);E.undo.onclick=()=>{const p=history.pop();if(p){points=p;render()}};E.clear.onclick=()=>{snapshot();points=[points[0],points.at(-1)];render()};E.route.onchange=e=>load(e.target.value);E.test.onclick=()=>{setAdd(false);if(ship)ship.remove();ship=L.marker(points[0],{icon:L.divIcon({className:'',html:'<div class="ship">⛴</div>',iconSize:[30,30],iconAnchor:[15,15]})}).addTo(map);const s=performance.now();cancelAnimationFrame(testFrame);const f=n=>{const p=Math.min(1,(n-s)/6500);ship.setLatLng(pos(p));if(p<1)testFrame=requestAnimationFrame(f)};testFrame=requestAnimationFrame(f)};E.copy.onclick=async()=>{try{await navigator.clipboard.writeText(E.json.value)}catch{E.json.select();document.execCommand('copy')}};E.download.onclick=()=>{const u=URL.createObjectURL(new Blob([E.json.value],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=`${active.id}.json`;a.click();URL.revokeObjectURL(u)};Promise.all([fetch('../data/ports.json').then(r=>{if(!r.ok)throw Error();return r.json()}),fetch('../data/routes.json').then(r=>{if(!r.ok)throw Error();return r.json()})]).then(([p,r])=>{ports=p?.ports??p;routes=normalizeRoutes(r).filter(x=>x.mode==='sea');if(!routes.length)throw Error('Rota yok')}).catch(()=>{ports=fallbackPorts;routes=fallbackRoutes;E.status.textContent='Yedek veri kullanılıyor'}).finally(()=>{E.route.innerHTML=routes.map(r=>`<option value="${r.id}">${name(r.origin)} → ${name(r.destination)}</option>`).join('');load(routes[0].id)});</script></body></html>
