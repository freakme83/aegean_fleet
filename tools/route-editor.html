<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aegean Fleet · Rota Editörü</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root { --navy:#0f2742; --terra:#c96c4a; --sea:#b9dce3; }
    * { box-sizing:border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; font-family:Inter,system-ui,sans-serif; color:var(--navy); }
    #map { position:fixed; inset:0; background:var(--sea); }
    .toolbar { position:fixed; z-index:1000; top:16px; left:16px; right:16px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:12px; border:1px solid rgba(15,39,66,.14); border-radius:18px; background:rgba(255,255,255,.94); backdrop-filter:blur(14px); box-shadow:0 14px 34px rgba(15,39,66,.16); }
    .toolbar h1 { margin:0 8px 0 0; font-size:17px; }
    select, button { height:36px; border:1px solid #d7e1e6; border-radius:10px; background:white; color:var(--navy); font-weight:700; padding:0 12px; }
    button { cursor:pointer; }
    button.primary { background:var(--navy); color:white; border-color:var(--navy); }
    button.danger { color:#b33d3d; }
    .status { margin-left:auto; padding:7px 10px; border-radius:999px; background:#edf5f7; color:#526b79; font-size:12px; font-weight:700; }
    .panel { position:fixed; z-index:1000; right:16px; bottom:16px; width:min(390px,calc(100vw - 32px)); padding:16px; border:1px solid rgba(15,39,66,.14); border-radius:18px; background:rgba(255,255,255,.95); backdrop-filter:blur(14px); box-shadow:0 16px 40px rgba(15,39,66,.18); }
    .panel h2 { margin:0 0 8px; font-size:16px; }
    .help { font-size:12px; line-height:1.55; color:#607482; }
    .metrics { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:12px 0; }
    .metric { padding:10px; border-radius:12px; background:#f3f7f8; }
    .metric small { display:block; color:#80909a; font-weight:700; text-transform:uppercase; font-size:10px; }
    .metric strong { display:block; margin-top:3px; font-size:17px; }
    textarea { width:100%; height:130px; resize:vertical; border:1px solid #d7e1e6; border-radius:12px; padding:10px; font:11px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace; color:#20384e; background:#f8fafb; }
    .panel-actions { display:flex; gap:8px; margin-top:10px; }
    .point-icon { width:24px; height:24px; display:grid; place-items:center; border-radius:999px; border:3px solid white; background:var(--terra); color:white; font-size:10px; font-weight:800; box-shadow:0 3px 10px rgba(15,39,66,.3); }
    .point-icon.locked { background:var(--navy); }
    .ship-icon { width:30px; height:30px; display:grid; place-items:center; border:3px solid white; border-radius:12px; background:var(--navy); color:white; font-size:16px; box-shadow:0 4px 12px rgba(15,39,66,.3); }
    .toast { position:fixed; z-index:1100; left:16px; bottom:16px; padding:11px 14px; border-radius:12px; background:rgba(15,39,66,.94); color:white; font-size:12px; font-weight:700; opacity:0; transform:translateY(8px); transition:.18s; pointer-events:none; }
    .toast.visible { opacity:1; transform:translateY(0); }
    @media(max-width:800px){ .status{width:100%;margin-left:0}.panel{left:16px;right:16px;width:auto}.toolbar{right:16px} }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="toolbar">
    <h1>Rota Editörü</h1>
    <select id="routeSelect"></select>
    <button id="undoButton">Geri al</button>
    <button id="clearButton" class="danger">Ara noktaları temizle</button>
    <button id="testButton">Rotayı test et</button>
    <span id="statusText" class="status">Yükleniyor…</span>
  </div>
  <aside class="panel">
    <h2>Manuel waypoint düzenleme</h2>
    <div class="help">
      Haritada deniz üzerine tıklayarak yeni waypoint ekle. Turuncu noktaları sürükle. Bir ara noktaya sağ tıklayarak sil. Başlangıç ve bitiş noktaları kilitlidir.
    </div>
    <div class="metrics">
      <div class="metric"><small>Waypoint</small><strong id="pointCount">0</strong></div>
      <div class="metric"><small>Yaklaşık mesafe</small><strong id="distanceText">0 km</strong></div>
    </div>
    <textarea id="jsonOutput" spellcheck="false"></textarea>
    <div class="panel-actions">
      <button id="copyButton" class="primary">JSON’u kopyala</button>
      <button id="downloadButton">JSON indir</button>
    </div>
  </aside>
  <div id="toast" class="toast"></div>

  <script>
    const routeSelect = document.getElementById('routeSelect');
    const statusText = document.getElementById('statusText');
    const pointCount = document.getElementById('pointCount');
    const distanceText = document.getElementById('distanceText');
    const jsonOutput = document.getElementById('jsonOutput');
    const toastElement = document.getElementById('toast');

    const map = L.map('map', { center:[39.22,26.62], zoom:10, minZoom:5, maxZoom:15, zoomControl:false, attributionControl:false });
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_nolabels/{z}/{x}/{y}{r}.png', { maxZoom:15 }).addTo(map);
    L.control.zoom({ position:'bottomleft' }).addTo(map);

    let ports = {};
    let routes = [];
    let activeRoute = null;
    let points = [];
    let markers = [];
    let polyline = L.polyline([], { color:'#315f78', weight:4, opacity:.85, dashArray:'10 9', lineCap:'round' }).addTo(map);
    let history = [];
    let shipMarker = null;
    let testFrame = null;

    function toast(message) {
      toastElement.textContent = message;
      toastElement.classList.add('visible');
      clearTimeout(toastElement.timer);
      toastElement.timer = setTimeout(() => toastElement.classList.remove('visible'), 2400);
    }

    function pointIcon(index, locked) {
      return L.divIcon({
        className:'',
        html:`<div class="point-icon ${locked ? 'locked' : ''}">${locked ? (index === 0 ? 'A' : 'B') : index}</div>`,
        iconSize:[24,24], iconAnchor:[12,12]
      });
    }

    function shipIcon() {
      return L.divIcon({ className:'', html:'<div class="ship-icon">⛴</div>', iconSize:[30,30], iconAnchor:[15,15] });
    }

    function snapshot() {
      history.push(points.map(p => [...p]));
      if (history.length > 80) history.shift();
    }

    function distanceKm(routePoints) {
      let total = 0;
      for (let i = 0; i < routePoints.length - 1; i++) {
        total += L.latLng(routePoints[i]).distanceTo(L.latLng(routePoints[i + 1]));
      }
      return total / 1000;
    }

    function outputObject() {
      return {
        id: activeRoute.id,
        mode: activeRoute.mode || 'sea',
        origin: activeRoute.origin,
        destination: activeRoute.destination,
        distanceKm: Number(distanceKm(points).toFixed(1)),
        durationMinutes: activeRoute.durationMinutes || 55,
        waypoints: points.map(([lat,lng]) => [Number(lat.toFixed(6)), Number(lng.toFixed(6))])
      };
    }

    function render() {
      markers.forEach(marker => marker.remove());
      markers = [];

      points.forEach((coords, index) => {
        const locked = index === 0 || index === points.length - 1;
        const marker = L.marker(coords, { icon:pointIcon(index, locked), draggable:!locked, zIndexOffset:700 }).addTo(map);
        if (!locked) {
          marker.on('dragstart', snapshot);
          marker.on('drag', event => {
            const ll = event.target.getLatLng();
            points[index] = [ll.lat, ll.lng];
            polyline.setLatLngs(points);
            updateInfo();
          });
          marker.on('contextmenu', () => {
            snapshot();
            points.splice(index, 1);
            render();
          });
        }
        markers.push(marker);
      });

      polyline.setLatLngs(points);
      updateInfo();
    }

    function updateInfo() {
      pointCount.textContent = points.length;
      distanceText.textContent = `${distanceKm(points).toFixed(1)} km`;
      jsonOutput.value = JSON.stringify(outputObject(), null, 2);
      statusText.textContent = `${activeRoute.origin} → ${activeRoute.destination}`;
    }

    function loadRoute(routeId) {
      cancelTest();
      activeRoute = routes.find(route => route.id === routeId) || routes[0];
      points = activeRoute.waypoints.map(point => [...point]);
      history = [];
      render();
      map.fitBounds(L.latLngBounds(points), { padding:[90,90] });
    }

    function nearestSegmentIndex(latlng) {
      const clickPoint = map.latLngToLayerPoint(latlng);
      let bestIndex = points.length - 1;
      let bestDistance = Infinity;
      for (let i = 0; i < points.length - 1; i++) {
        const a = map.latLngToLayerPoint(points[i]);
        const b = map.latLngToLayerPoint(points[i + 1]);
        const abx = b.x - a.x, aby = b.y - a.y;
        const apx = clickPoint.x - a.x, apy = clickPoint.y - a.y;
        const denom = abx * abx + aby * aby || 1;
        const t = Math.max(0, Math.min(1, (apx * abx + apy * aby) / denom));
        const x = a.x + abx * t, y = a.y + aby * t;
        const distance = Math.hypot(clickPoint.x - x, clickPoint.y - y);
        if (distance < bestDistance) { bestDistance = distance; bestIndex = i + 1; }
      }
      return bestIndex;
    }

    map.on('click', event => {
      if (!activeRoute) return;
      snapshot();
      const insertAt = nearestSegmentIndex(event.latlng);
      points.splice(insertAt, 0, [event.latlng.lat, event.latlng.lng]);
      render();
    });

    function cancelTest() {
      if (testFrame) cancelAnimationFrame(testFrame);
      testFrame = null;
      if (shipMarker) { shipMarker.remove(); shipMarker = null; }
    }

    function routePosition(progress) {
      const lengths = [];
      let total = 0;
      for (let i = 0; i < points.length - 1; i++) {
        const length = L.latLng(points[i]).distanceTo(L.latLng(points[i + 1]));
        lengths.push(length); total += length;
      }
      let target = total * progress;
      for (let i = 0; i < lengths.length; i++) {
        if (target <= lengths[i]) {
          const ratio = target / lengths[i];
          return [
            points[i][0] + (points[i + 1][0] - points[i][0]) * ratio,
            points[i][1] + (points[i + 1][1] - points[i][1]) * ratio
          ];
        }
        target -= lengths[i];
      }
      return points[points.length - 1];
    }

    function testRoute() {
      cancelTest();
      shipMarker = L.marker(points[0], { icon:shipIcon(), zIndexOffset:1000 }).addTo(map);
      const start = performance.now();
      const duration = 6500;
      function animate(now) {
        const progress = Math.min(1, (now - start) / duration);
        shipMarker.setLatLng(routePosition(progress));
        if (progress < 1) testFrame = requestAnimationFrame(animate);
        else { testFrame = null; toast('Rota testi tamamlandı.'); }
      }
      testFrame = requestAnimationFrame(animate);
    }

    document.getElementById('undoButton').addEventListener('click', () => {
      cancelTest();
      const previous = history.pop();
      if (!previous) return toast('Geri alınacak işlem yok.');
      points = previous;
      render();
    });

    document.getElementById('clearButton').addEventListener('click', () => {
      cancelTest();
      snapshot();
      points = [points[0], points[points.length - 1]];
      render();
    });

    document.getElementById('testButton').addEventListener('click', testRoute);
    routeSelect.addEventListener('change', event => loadRoute(event.target.value));

    document.getElementById('copyButton').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(jsonOutput.value);
        toast('JSON panoya kopyalandı.');
      } catch {
        jsonOutput.select();
        document.execCommand('copy');
        toast('JSON panoya kopyalandı.');
      }
    });

    document.getElementById('downloadButton').addEventListener('click', () => {
      const blob = new Blob([jsonOutput.value], { type:'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `${activeRoute.id}.json`;
      link.click();
      URL.revokeObjectURL(url);
    });

    Promise.all([
      fetch('../data/ports.json').then(response => response.json()),
      fetch('../data/routes.json').then(response => response.json())
    ]).then(([portsData, routesData]) => {
      ports = portsData.ports || portsData;
      routes = (routesData.routes || routesData).filter(route => route.mode === 'sea');
      if (!routes.length) throw new Error('Düzenlenebilir deniz rotası bulunamadı.');
      routeSelect.innerHTML = routes.map(route => `<option value="${route.id}">${route.origin} → ${route.destination}</option>`).join('');
      loadRoute(routes[0].id);
      statusText.textContent = 'Hazır';
    }).catch(error => {
      console.error(error);
      statusText.textContent = 'Veri yüklenemedi';
      toast('Rota verileri yüklenemedi. Sayfayı Netlify/GitHub Pages üzerinden aç.');
    });
  </script>
</body>
</html>
