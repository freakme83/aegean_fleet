<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aegean Fleet</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #0f2742;
      --sea: #b9dce3;
      --paper: rgba(255, 255, 255, 0.94);
      --terra: #c96c4a;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { font-family: Inter, system-ui, sans-serif; background: var(--sea); color: var(--navy); }
    #map { position: fixed; inset: 0; background: var(--sea); }
    .leaflet-container { background: var(--sea); font-family: Inter, system-ui, sans-serif; }

    .topbar {
      position: fixed;
      z-index: 1000;
      top: 18px;
      left: 18px;
      right: 18px;
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 12px 16px;
      border: 1px solid rgba(15, 39, 66, 0.12);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.90);
      backdrop-filter: blur(14px);
      box-shadow: 0 16px 38px rgba(15, 39, 66, 0.14);
    }

    .panel {
      position: fixed;
      z-index: 1000;
      right: 18px;
      bottom: 18px;
      width: min(360px, calc(100vw - 36px));
      padding: 18px;
      border: 1px solid rgba(15, 39, 66, 0.12);
      border-radius: 22px;
      background: var(--paper);
      backdrop-filter: blur(14px);
      box-shadow: 0 20px 50px rgba(15, 39, 66, 0.18);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 10px;
      border-radius: 999px;
      background: #edf5f7;
      color: #456274;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    .speed-button {
      min-width: 42px;
      height: 34px;
      padding: 0 10px;
      border-radius: 10px;
      color: #486173;
      font-size: 13px;
      font-weight: 700;
      transition: 120ms ease;
    }
    .speed-button:hover { background: #edf5f7; }
    .speed-button.active { background: var(--navy); color: white; }

    .port-dot {
      width: 18px;
      height: 18px;
      border: 4px solid white;
      border-radius: 999px;
      background: var(--terra);
      box-shadow: 0 3px 10px rgba(15, 39, 66, 0.28);
    }

    .ship-icon {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 3px solid white;
      border-radius: 12px;
      background: var(--navy);
      box-shadow: 0 5px 14px rgba(15, 39, 66, 0.32);
      color: white;
      font-size: 18px;
      transform-origin: center;
    }

    .ship-label {
      padding: 4px 8px;
      border: 0;
      border-radius: 9px;
      background: rgba(15, 39, 66, 0.88);
      box-shadow: none;
      color: white;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }
    .ship-label::before { display: none; }

    input[type="range"] { accent-color: var(--terra); }

    .progress-track {
      height: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: #e8eff2;
    }
    .progress-fill {
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, #c96c4a, #e29b68);
      transition: width 150ms linear;
    }

    .notification {
      position: fixed;
      z-index: 1100;
      left: 18px;
      bottom: 18px;
      max-width: min(420px, calc(100vw - 36px));
      padding: 12px 15px;
      border-radius: 14px;
      background: rgba(15, 39, 66, 0.92);
      color: white;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 12px 28px rgba(15, 39, 66, 0.25);
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: 180ms ease;
    }
    .notification.visible { opacity: 1; transform: translateY(0); }

    @media (max-width: 760px) {
      .topbar { align-items: flex-start; flex-direction: column; }
      .topbar-right { width: 100%; justify-content: space-between; }
      .panel { left: 18px; right: 18px; width: auto; }
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <header class="topbar">
    <div class="flex items-center gap-4 min-w-0">
      <div class="w-10 h-10 rounded-xl bg-slate-900 text-white grid place-items-center text-xl">⛴</div>
      <div class="min-w-0">
        <h1 class="text-lg font-bold tracking-tight">Aegean Fleet</h1>
        <div class="flex flex-wrap items-center gap-2 mt-1">
          <span id="dateText" class="text-sm font-semibold text-slate-600">1 Mayıs 2020 · 08:00</span>
          <span id="seasonBadge" class="pill">Yoğun sezon</span>
        </div>
      </div>
    </div>

    <div class="topbar-right flex items-center gap-3">
      <div class="hidden sm:block text-right">
        <div class="text-[11px] uppercase tracking-wider text-slate-400 font-bold">Kasa</div>
        <div id="cashText" class="text-base font-bold">₺10.000</div>
      </div>
      <div class="flex items-center gap-1 p-1 rounded-xl bg-slate-100">
        <button class="speed-button" data-speed="0">Ⅱ</button>
        <button class="speed-button active" data-speed="1">1×</button>
        <button class="speed-button" data-speed="5">5×</button>
        <button class="speed-button" data-speed="10">10×</button>
      </div>
    </div>
  </header>

  <aside class="panel">
    <div class="flex items-start justify-between gap-3">
      <div>
        <div class="text-xs font-bold uppercase tracking-wider text-slate-400">Tek gemi prototipi</div>
        <h2 class="text-xl font-bold mt-1">MV Ege</h2>
        <p id="statusText" class="text-sm text-slate-500 mt-1">Ayvalık'ta yolcu alıyor</p>
      </div>
      <div id="routeBadge" class="pill">Ayvalık → Midilli</div>
    </div>

    <div class="grid grid-cols-3 gap-2 mt-5">
      <div class="rounded-2xl bg-slate-50 p-3">
        <div class="text-[11px] text-slate-400 font-bold uppercase">Gemide</div>
        <div class="mt-1 text-lg font-bold"><span id="occupancyText">0</span>/60</div>
      </div>
      <div class="rounded-2xl bg-slate-50 p-3">
        <div class="text-[11px] text-slate-400 font-bold uppercase">Ayvalık</div>
        <div id="ayvalikWaitingText" class="mt-1 text-lg font-bold">0</div>
      </div>
      <div class="rounded-2xl bg-slate-50 p-3">
        <div class="text-[11px] text-slate-400 font-bold uppercase">Midilli</div>
        <div id="mytileneWaitingText" class="mt-1 text-lg font-bold">0</div>
      </div>
    </div>

    <div class="mt-5">
      <div class="flex items-center justify-between gap-3">
        <label for="fullnessRange" class="text-sm font-bold">Kalkış doluluğu</label>
        <span id="fullnessText" class="pill">%80</span>
      </div>
      <input id="fullnessRange" class="w-full mt-3" type="range" min="10" max="100" step="10" value="80" />
      <div class="flex justify-between text-[11px] text-slate-400 mt-1">
        <span>Daha sık</span><span>Daha dolu</span>
      </div>
    </div>

    <div class="mt-5">
      <div class="flex items-center justify-between text-xs font-semibold text-slate-500 mb-2">
        <span id="progressLabel">Doluluk: %0</span>
        <span id="targetPassengerText">Hedef: 48 yolcu</span>
      </div>
      <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
    </div>

    <div class="mt-5 pt-4 border-t border-slate-100 flex items-center justify-between gap-4">
      <div class="text-xs text-slate-500 leading-5">
        <strong>1× hızda:</strong> 1 gerçek saniye = 1 oyun dakikası.
      </div>
      <button id="resetButton" class="text-xs font-bold text-slate-400 hover:text-red-600 transition">Sıfırla</button>
    </div>
  </aside>

  <div id="notification" class="notification"></div>

  <script>
    const PORTS = {
      ayvalik: { name: 'Ayvalık', coords: [39.3192, 26.6961], demand: 1.00 },
      mytilene: { name: 'Midilli', coords: [39.1044, 26.5621], demand: 1.08 }
    };

    const ROUTE = [
      [39.3192, 26.6961],
      [39.3370, 26.6500],
      [39.3060, 26.6020],
      [39.2200, 26.5650],
      [39.1044, 26.5621]
    ];

    const CAPACITY = 60;
    const TRIP_MINUTES = 55;
    const TICKET_REVENUE = 140;
    const TRIP_COST = 600;
    const SAVE_KEY = 'aegean-fleet-minimal-v1';
    const START_DATE = new Date(2020, 4, 1, 8, 0, 0, 0);

    const state = {
      gameMinutes: 0,
      speed: 1,
      cash: 10000,
      fullnessTarget: 80,
      location: 'ayvalik',
      destination: 'mytilene',
      status: 'boarding',
      passengers: 0,
      waiting: { ayvalik: 8, mytilene: 5 },
      demandFractions: { ayvalik: 0, mytilene: 0 },
      tripProgress: 0,
      completedTrips: 0
    };

    let lastFrame = performance.now();
    let lastSavedMinute = -1;
    let notificationTimer = null;

    const map = L.map('map', {
      center: [39.22, 26.62],
      zoom: 10,
      minZoom: 8,
      maxZoom: 13,
      zoomControl: false,
      attributionControl: false
    });

    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_nolabels/{z}/{x}/{y}{r}.png', {
      maxZoom: 13
    }).addTo(map);

    L.control.zoom({ position: 'bottomleft' }).addTo(map);

    const portIcon = L.divIcon({
      className: '',
      html: '<div class="port-dot"></div>',
      iconSize: [18, 18],
      iconAnchor: [9, 9]
    });

    L.marker(PORTS.ayvalik.coords, { icon: portIcon })
      .addTo(map)
      .bindTooltip('Ayvalık', { permanent: true, direction: 'right', offset: [10, 0] });

    L.marker(PORTS.mytilene.coords, { icon: portIcon })
      .addTo(map)
      .bindTooltip('Midilli', { permanent: true, direction: 'left', offset: [-10, 0] });

    L.polyline(ROUTE, {
      color: '#315f78',
      weight: 3,
      opacity: 0.65,
      dashArray: '8 10',
      lineCap: 'round'
    }).addTo(map);

    const shipIcon = L.divIcon({
      className: '',
      html: '<div class="ship-icon">⛴</div>',
      iconSize: [34, 34],
      iconAnchor: [17, 17]
    });

    const shipMarker = L.marker(PORTS.ayvalik.coords, { icon: shipIcon, zIndexOffset: 1000 })
      .addTo(map)
      .bindTooltip('MV Ege', {
        permanent: true,
        direction: 'top',
        offset: [0, -17],
        className: 'ship-label'
      });

    const els = {
      date: document.getElementById('dateText'),
      season: document.getElementById('seasonBadge'),
      cash: document.getElementById('cashText'),
      status: document.getElementById('statusText'),
      route: document.getElementById('routeBadge'),
      occupancy: document.getElementById('occupancyText'),
      ayvalikWaiting: document.getElementById('ayvalikWaitingText'),
      mytileneWaiting: document.getElementById('mytileneWaitingText'),
      fullnessRange: document.getElementById('fullnessRange'),
      fullnessText: document.getElementById('fullnessText'),
      progressLabel: document.getElementById('progressLabel'),
      targetPassenger: document.getElementById('targetPassengerText'),
      progressFill: document.getElementById('progressFill'),
      reset: document.getElementById('resetButton'),
      notification: document.getElementById('notification')
    };

    function currentDate() {
      return new Date(START_DATE.getTime() + state.gameMinutes * 60000);
    }

    function getSeason(date) {
      const month = date.getMonth() + 1;
      if ([6, 7, 8].includes(month)) {
        return { name: 'Çok yoğun sezon', multiplier: 1.55 };
      }
      if ([5, 9].includes(month)) {
        return { name: 'Yoğun sezon', multiplier: 1.00 };
      }
      if ([4, 10].includes(month)) {
        return { name: 'Sakin sezon', multiplier: 0.48 };
      }
      return { name: 'Çok sakin sezon', multiplier: 0.22 };
    }

    function getTargetPassengers() {
      return Math.max(1, Math.ceil(CAPACITY * state.fullnessTarget / 100));
    }

    function formatDate(date) {
      const datePart = new Intl.DateTimeFormat('tr-TR', {
        day: 'numeric', month: 'long', year: 'numeric'
      }).format(date);
      const timePart = new Intl.DateTimeFormat('tr-TR', {
        hour: '2-digit', minute: '2-digit', hour12: false
      }).format(date);
      return `${datePart} · ${timePart}`;
    }

    function formatMoney(value) {
      return new Intl.NumberFormat('tr-TR', {
        style: 'currency', currency: 'TRY', maximumFractionDigits: 0
      }).format(value);
    }

    function showNotification(message) {
      els.notification.textContent = message;
      els.notification.classList.add('visible');
      clearTimeout(notificationTimer);
      notificationTimer = setTimeout(() => {
        els.notification.classList.remove('visible');
      }, 3200);
    }

    function generatePassengers(gameMinutesElapsed) {
      const season = getSeason(currentDate());
      const basePassengersPerMinute = 0.78;

      for (const portKey of Object.keys(PORTS)) {
        const generated = gameMinutesElapsed * basePassengersPerMinute * season.multiplier * PORTS[portKey].demand;
        state.demandFractions[portKey] += generated;

        const wholePassengers = Math.floor(state.demandFractions[portKey]);
        if (wholePassengers > 0) {
          state.waiting[portKey] += wholePassengers;
          state.demandFractions[portKey] -= wholePassengers;
        }
      }
    }

    function boardPassengers() {
      if (state.status !== 'boarding') return;

      const availableSeats = CAPACITY - state.passengers;
      const boardingNow = Math.min(availableSeats, state.waiting[state.location]);
      state.passengers += boardingNow;
      state.waiting[state.location] -= boardingNow;

      if (state.passengers >= getTargetPassengers()) {
        depart();
      }
    }

    function depart() {
      if (state.status !== 'boarding' || state.passengers === 0) return;
      state.status = 'sailing';
      state.tripProgress = 0;
      showNotification(`MV Ege ${PORTS[state.location].name} limanından ${state.passengers} yolcuyla ayrıldı.`);
    }

    function arrive() {
      const arrivedAt = state.destination;
      const revenue = state.passengers * TICKET_REVENUE;
      const profit = revenue - TRIP_COST;

      state.cash += profit;
      state.completedTrips += 1;
      state.location = arrivedAt;
      state.destination = arrivedAt === 'ayvalik' ? 'mytilene' : 'ayvalik';
      state.status = 'boarding';
      state.tripProgress = 0;

      showNotification(`${PORTS[arrivedAt].name} seferi tamamlandı. Net gelir: ${formatMoney(profit)}.`);
      state.passengers = 0;
      boardPassengers();
    }

    function routePosition(progress) {
      const points = state.location === 'ayvalik' && state.destination === 'mytilene'
        ? ROUTE
        : [...ROUTE].reverse();

      if (progress <= 0) return points[0];
      if (progress >= 1) return points[points.length - 1];

      const segmentLengths = [];
      let totalLength = 0;
      for (let i = 0; i < points.length - 1; i++) {
        const a = L.latLng(points[i]);
        const b = L.latLng(points[i + 1]);
        const length = a.distanceTo(b);
        segmentLengths.push(length);
        totalLength += length;
      }

      let targetDistance = totalLength * progress;
      for (let i = 0; i < segmentLengths.length; i++) {
        if (targetDistance <= segmentLengths[i]) {
          const ratio = targetDistance / segmentLengths[i];
          return [
            points[i][0] + (points[i + 1][0] - points[i][0]) * ratio,
            points[i][1] + (points[i + 1][1] - points[i][1]) * ratio
          ];
        }
        targetDistance -= segmentLengths[i];
      }
      return points[points.length - 1];
    }

    function updateSimulation(gameMinutesElapsed) {
      if (gameMinutesElapsed <= 0) return;

      state.gameMinutes += gameMinutesElapsed;
      generatePassengers(gameMinutesElapsed);

      if (state.status === 'boarding') {
        boardPassengers();
      } else {
        state.tripProgress += gameMinutesElapsed / TRIP_MINUTES;
        if (state.tripProgress >= 1) arrive();
      }

      const currentWholeMinute = Math.floor(state.gameMinutes);
      if (currentWholeMinute !== lastSavedMinute && currentWholeMinute % 5 === 0) {
        saveGame();
        lastSavedMinute = currentWholeMinute;
      }
    }

    function render() {
      const date = currentDate();
      const season = getSeason(date);
      const targetPassengers = getTargetPassengers();

      els.date.textContent = formatDate(date);
      els.season.textContent = season.name;
      els.cash.textContent = formatMoney(state.cash);
      els.occupancy.textContent = state.passengers;
      els.ayvalikWaiting.textContent = state.waiting.ayvalik;
      els.mytileneWaiting.textContent = state.waiting.mytilene;
      els.fullnessRange.value = state.fullnessTarget;
      els.fullnessText.textContent = `%${state.fullnessTarget}`;
      els.targetPassenger.textContent = `Hedef: ${targetPassengers} yolcu`;

      if (state.status === 'boarding') {
        const locationName = PORTS[state.location].name;
        const destinationName = PORTS[state.destination].name;
        const targetProgress = Math.min(100, Math.round(state.passengers / targetPassengers * 100));
        els.status.textContent = `${locationName}'ta yolcu alıyor`;
        els.route.textContent = `${locationName} → ${destinationName}`;
        els.progressLabel.textContent = `Kalkış hedefi: %${targetProgress}`;
        els.progressFill.style.width = `${targetProgress}%`;
        shipMarker.setLatLng(PORTS[state.location].coords);
      } else {
        const locationName = PORTS[state.location].name;
        const destinationName = PORTS[state.destination].name;
        const journeyPercent = Math.min(100, Math.round(state.tripProgress * 100));
        els.status.textContent = `${destinationName} yönünde seyirde`;
        els.route.textContent = `${locationName} → ${destinationName}`;
        els.progressLabel.textContent = `Sefer: %${journeyPercent}`;
        els.progressFill.style.width = `${journeyPercent}%`;
        shipMarker.setLatLng(routePosition(state.tripProgress));
      }
    }

    function saveGame() {
      localStorage.setItem(SAVE_KEY, JSON.stringify(state));
    }

    function loadGame() {
      try {
        const saved = JSON.parse(localStorage.getItem(SAVE_KEY));
        if (!saved) return;
        Object.assign(state, saved);
        state.waiting = { ...state.waiting, ...saved.waiting };
        state.demandFractions = { ...state.demandFractions, ...saved.demandFractions };
      } catch (error) {
        console.warn('Kayıt okunamadı:', error);
      }
    }

    function resetGame() {
      localStorage.removeItem(SAVE_KEY);
      window.location.reload();
    }

    els.fullnessRange.addEventListener('input', (event) => {
      state.fullnessTarget = Number(event.target.value);
      boardPassengers();
      saveGame();
      render();
    });

    els.reset.addEventListener('click', resetGame);

    document.querySelectorAll('.speed-button').forEach((button) => {
      button.addEventListener('click', () => {
        state.speed = Number(button.dataset.speed);
        document.querySelectorAll('.speed-button').forEach((item) => item.classList.remove('active'));
        button.classList.add('active');
        saveGame();
      });
    });

    function syncSpeedButtons() {
      document.querySelectorAll('.speed-button').forEach((button) => {
        button.classList.toggle('active', Number(button.dataset.speed) === state.speed);
      });
    }

    function frame(now) {
      const realSeconds = Math.min(0.25, (now - lastFrame) / 1000);
      lastFrame = now;

      // Temel zaman kuralı: 1x hızda 1 gerçek saniye = 1 oyun dakikası.
      updateSimulation(realSeconds * state.speed);
      render();
      requestAnimationFrame(frame);
    }

    loadGame();
    syncSpeedButtons();
    boardPassengers();
    render();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
